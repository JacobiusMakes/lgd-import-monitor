<title id="t">US imports of cut lab-grown diamonds by month, HS 710491</title>
<desc id="d">Monthly customs value of US imports under HS 710491 from January 2024 to 202606, UN Comtrade. Values fell from a 2024 average near $88.9 million to $13.7 million a month after September 2025.</desc>
